name: Cupra Garage - ARSO warnings
on:
  workflow_dispatch:
  schedule:
    - cron: '11,41 * * * *'
permissions:
  contents: write
jobs:
  update-arso:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch ARSO CAP and generate JSON
        run: python scripts/update_arso.py
      - name: Publish snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add arso-warnings.json
          git diff --cached --quiet || (git commit -m 'Update ARSO warnings snapshot' && git push)
