name: Posodobi Cupra Garage podatke

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cupra-garage-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Prevzemi repozitorij
        uses: actions/checkout@v4
      - name: Nastavi Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prenesi podatke iz Google Sheets
        run: python scripts/update_data.py
      - name: Objavi osvežene podatke
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if ! git diff --cached --quiet; then
            git commit -m "Samodejna osvežitev Cupra Garage podatkov"
            git push
          else
            echo "Ni sprememb."
          fi
